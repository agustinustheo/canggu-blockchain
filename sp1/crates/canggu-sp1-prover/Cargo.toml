[package]
name = "canggu-sp1-prover"
description = "Proves the canggu-sp1 SP1 guests (compressed STARK proofs, CPU)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "canggu-sp1"
path = "src/bin/canggu-sp1.rs"

[dependencies]
anyhow = "1"
bincode = "1.3.3"
canggu-mldsa = { path = "../canggu-mldsa" }
canggu-sp1-verify = { path = "../canggu-sp1-verify" }
# Signing for test corpora and benchmarks (`testkit`).
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc"] }
# No `network` (prover network, AWS/KMS, gRPC), no `native-gnark` (Groth16/PLONK wrapping):
# only the local CPU prover up to compressed proofs.
sp1-sdk = { version = "=6.10.0", default-features = false, features = ["blocking"] }

[dev-dependencies]
# Independent hash implementations to check the public-values layout.
blake2b_simd = "1.0.2"
sha3 = "0.10.8"
