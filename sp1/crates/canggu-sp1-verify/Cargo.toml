# Verifier for canggu-sp1 compressed (STARK) proofs. Depends only on `sp1-verifier` so that a node
# (host function) or runtime can verify without the SP1 SDK or toolchain. Kept out of the parent
# workspace so its lock file shows the real, minimal dependency set.
[workspace]

[package]
name = "canggu-sp1-verify"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[features]
default = ["std"]
# `std` only affects `sp1-verifier`'s error types; verification itself is `no_std` + `alloc`.
std = ["sp1-verifier/std"]

[dependencies]
# `full` (compressed-proof verification) is the only feature we need.
sp1-verifier = { version = "=6.10.0", default-features = false, features = ["full"] }
# The proof encoding; already a dependency of `sp1-verifier/full`. Needed directly to enforce a
# canonical encoding (see `src/lib.rs`).
bincode = { version = "1.3.3", default-features = false }

[dev-dependencies]
# The tests call the raw verifier to show what the canonical-encoding check adds.
sp1-verifier = { version = "=6.10.0", default-features = false, features = ["full"] }

[profile.release]
opt-level = 3

# `sp1-verifier/full` pulls `ff` -> `rand_core 0.6` -> `getrandom 0.2` (never called while
# verifying). On `wasm32-unknown-unknown` getrandom refuses to build without a backend, so select
# the "custom" backend and register an always-failing source (see `src/lib.rs`).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", default-features = false, features = ["custom"] }
