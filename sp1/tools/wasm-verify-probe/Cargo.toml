# Probe: does `canggu-sp1-verify` link and run as a wasm32-unknown-unknown module, and how fast?
# Build: cargo build --release --target wasm32-unknown-unknown
# Run:   node run.mjs  (uses ../../fixtures)
[workspace]

[package]
name = "wasm-verify-probe"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
canggu-sp1-verify = { path = "../../crates/canggu-sp1-verify", default-features = false }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
