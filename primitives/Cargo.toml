[package]
name = "canggu-primitives"
description = "Canggu primitives: ML-DSA (Dilithium) account signatures and native crypto host functions."
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
codec = { features = ["derive", "max-encoded-len"], workspace = true }
scale-info = { features = ["derive"], workspace = true }
sp-core = { workspace = true }
sp-io = { workspace = true }
sp-runtime = { workspace = true }
sp-runtime-interface = { workspace = true }

# Native-only: these never get compiled into the Wasm runtime. The runtime reaches them through
# the `canggu_crypto` host functions, which is also the seam where a GPU backend would plug in.
ark-bls12-381 = { workspace = true, optional = true, features = ["curve"] }
ark-ff = { workspace = true, optional = true }
ark-groth16 = { workspace = true, optional = true }
ark-serialize = { workspace = true, optional = true }
log = { workspace = true, optional = true }
ml-dsa = { workspace = true, optional = true, features = ["alloc"] }
rayon = { workspace = true, optional = true }

[dev-dependencies]
hex = { workspace = true, features = ["std"] }

[features]
default = ["std"]
std = [
	"ark-bls12-381/std",
	"ark-ff/std",
	"ark-groth16/std",
	"ark-serialize/std",
	"codec/std",
	"log/std",
	"ml-dsa",
	"rayon",
	"scale-info/std",
	"sp-core/std",
	"sp-io/std",
	"sp-runtime-interface/std",
	"sp-runtime/std",
]
